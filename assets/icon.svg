<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 暗色仪表面板渐变（与 Web 控制台面板一致） -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#333a43"/>
      <stop offset="0.55" stop-color="#20262d"/>
      <stop offset="1"   stop-color="#121519"/>
    </linearGradient>
    <!-- 顶部高光斜角 -->
    <linearGradient id="edgeHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#6c757f"/>
      <stop offset="0.5" stop-color="#3a4048"/>
      <stop offset="1"   stop-color="#191d22"/>
    </linearGradient>
    <!-- 琥珀色强调渐变（与控制台 #ffd27f 一致） -->
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffe7b0"/>
      <stop offset="0.45" stop-color="#ffc257"/>
      <stop offset="1"   stop-color="#ff8f2e"/>
    </linearGradient>
    <linearGradient id="amberDim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#caa05a"/>
      <stop offset="1"   stop-color="#8a5a1e"/>
    </linearGradient>
    <!-- 暖色辉光 -->
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.5">
      <stop offset="0"   stop-color="#ffd27f" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#ffb24d" stop-opacity="0.18"/>
      <stop offset="1"   stop-color="#ffb24d" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>

  <!-- 磁贴底 -->
  <rect x="10" y="10" width="236" height="236" rx="50" ry="50" fill="url(#tile)" stroke="#0a0c0f" stroke-width="2"/>
  <rect x="11" y="11" width="234" height="234" rx="49" ry="49" fill="none" stroke="url(#edgeHi)" stroke-width="1.4"/>

  <!-- 暖色辉光 -->
  <ellipse cx="128" cy="118" rx="96" ry="88" fill="url(#glow)"/>

  <!-- 桥面（桥接弧线，连接左右端点） -->
  <path d="M52 204 Q128 226 204 204" fill="none" stroke="url(#amberDim)" stroke-width="7" stroke-linecap="round"/>
  <!-- 桥墩 -->
  <rect x="44" y="204" width="14" height="20" rx="3" fill="url(#amberDim)"/>
  <rect x="198" y="204" width="14" height="20" rx="3" fill="url(#amberDim)"/>

  <!-- 音频波形（发光主体） -->
  <path id="wave" d="M44 132 C 62 86 86 86 104 132 C 122 178 146 178 164 132 C 182 86 206 86 218 132"
        fill="none" stroke="url(#amber)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 波形辉光（模糊副本） -->
  <use href="#wave" stroke="#ffd27f" stroke-width="20" opacity="0.30" filter="url(#soft)"/>

  <!-- 端点节点（输入/输出端口） -->
  <circle cx="44" cy="132" r="12" fill="url(#amber)"/>
  <circle cx="218" cy="132" r="12" fill="url(#amber)"/>
  <circle cx="44" cy="132" r="12" fill="none" stroke="#fff3da" stroke-width="1.6" opacity="0.85"/>
  <circle cx="218" cy="132" r="12" fill="none" stroke="#fff3da" stroke-width="1.6" opacity="0.85"/>
  <circle cx="44" cy="132" r="4.5" fill="#3a2a12"/>
  <circle cx="218" cy="132" r="4.5" fill="#3a2a12"/>
</svg>
