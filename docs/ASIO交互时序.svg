<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 760" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrB" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#2563eb"/></marker>
    <marker id="arrO" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#ea580c"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#dc2626"/></marker>
  </defs>
  <rect x="0" y="0" width="680" height="760" fill="#ffffff"/>
  <text x="340" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">ASIO 宿主与驱动的完整交互时序</text>
  <text x="340" y="50" text-anchor="middle" font-size="12" fill="#6b7280">蓝色 = 初始化阶段（一次性）· 橙色 = 运行时循环（每个音频周期）</text>

  <!-- 生命线顶部的角色框 -->
  <rect x="35" y="66" width="190" height="30" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="130" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730a3">你的应用（ASIO Host）</text>
  <rect x="310" y="66" width="180" height="30" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="400" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46">ASIO 驱动（厂商 DLL）</text>
  <rect x="545" y="66" width="110" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="600" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">音频硬件</text>

  <!-- 生命线 -->
  <line x1="130" y1="96" x2="130" y2="705" stroke="#cbd5e1" stroke-dasharray="4 4"/>
  <line x1="400" y1="96" x2="400" y2="705" stroke="#cbd5e1" stroke-dasharray="4 4"/>
  <line x1="600" y1="96" x2="600" y2="705" stroke="#cbd5e1" stroke-dasharray="4 4"/>

  <!-- 阶段一标题 -->
  <rect x="20" y="112" width="220" height="22" rx="11" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="130" y="127" text-anchor="middle" font-size="12" font-weight="bold" fill="#3730a3">阶段一：初始化（一次性）</text>

  <!-- ① 自环：枚举注册表 -->
  <path d="M130 148 h55 q6 0 6 6 v12 q0 6 -6 6 h-55" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrB)"/>
  <text x="200" y="160" font-size="12" fill="#374151">① 枚举注册表 HKLM\SOFTWARE\ASIO</text>

  <!-- ② CoCreateInstance -->
  <line x1="140" y1="196" x2="392" y2="196" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrB)"/>
  <text x="266" y="189" text-anchor="middle" font-size="12" fill="#374151">② CoCreateInstance() 获取 IASIO 接口</text>

  <!-- ③ init -->
  <line x1="140" y1="238" x2="392" y2="238" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrB)"/>
  <text x="266" y="231" text-anchor="middle" font-size="12" fill="#374151">③ init(&amp;driverInfo)</text>

  <!-- ④ 查询能力 -->
  <line x1="140" y1="280" x2="392" y2="280" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrB)"/>
  <text x="266" y="273" text-anchor="middle" font-size="12" fill="#374151">④ getChannels / getBufferSize / 通道格式</text>

  <!-- ⑤ setSampleRate -->
  <line x1="140" y1="322" x2="392" y2="322" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrB)"/>
  <text x="266" y="315" text-anchor="middle" font-size="12" fill="#374151">⑤ canSampleRate(48k) → setSampleRate(48000)</text>

  <!-- ⑥ createBuffers -->
  <line x1="140" y1="364" x2="392" y2="364" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrB)"/>
  <text x="266" y="357" text-anchor="middle" font-size="12" fill="#374151">⑥ createBuffers() 分配双缓冲 + 注册回调</text>

  <!-- ⑦ start -->
  <line x1="140" y1="406" x2="392" y2="406" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrB)"/>
  <text x="266" y="399" text-anchor="middle" font-size="12" fill="#374151">⑦ start()</text>

  <!-- 阶段二标题 -->
  <rect x="20" y="440" width="280" height="22" rx="11" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="160" y="455" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a3412">阶段二：运行时（每个音频周期循环）</text>

  <!-- ⑧ DMA中断 -->
  <line x1="600" y1="492" x2="408" y2="492" stroke="#ea580c" stroke-width="1.6" marker-end="url(#arrO)"/>
  <text x="505" y="485" text-anchor="middle" font-size="12" fill="#374151">⑧ DMA 播完一个缓冲区 → 硬件中断</text>

  <!-- ⑨ bufferSwitch 回调（反向，强调） -->
  <line x1="390" y1="537" x2="138" y2="537" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrR)"/>
  <text x="264" y="528" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#dc2626">⑨ bufferSwitch(index) ← 驱动线程回调！</text>

  <!-- ⑩ getBufferPointer -->
  <line x1="140" y1="580" x2="392" y2="580" stroke="#ea580c" stroke-width="1.6" marker-end="url(#arrO)"/>
  <text x="266" y="573" text-anchor="middle" font-size="12" fill="#374151">⑩ getBufferPointer(index) 取缓冲区地址</text>

  <!-- ⑪ 填充数据（自环） -->
  <path d="M130 618 h55 q6 0 6 6 v12 q0 6 -6 6 h-55" fill="none" stroke="#ea580c" stroke-width="1.6" marker-end="url(#arrO)"/>
  <text x="200" y="630" font-size="12" fill="#374151">⑪ 填充 PCM（float → 驱动格式转换）</text>

  <!-- ⑫ outputReady -->
  <line x1="140" y1="668" x2="392" y2="668" stroke="#ea580c" stroke-width="1.6" marker-end="url(#arrO)"/>
  <text x="266" y="661" text-anchor="middle" font-size="12" fill="#374151">⑫ outputReady() 通知驱动数据就绪</text>

  <!-- ⑬ DMA继续 -->
  <line x1="400" y1="700" x2="592" y2="700" stroke="#ea580c" stroke-width="1.6" marker-end="url(#arrO)"/>
  <text x="496" y="693" text-anchor="middle" font-size="12" fill="#374151">⑬ DMA 播放刚填充的缓冲区</text>

  <!-- 底部说明 -->
  <rect x="20" y="722" width="640" height="28" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="340" y="740" text-anchor="middle" font-size="12" fill="#475569">双缓冲乒乓交替（index 0/1）：驱动播放其中一块时，宿主填充另一块 · 总延迟 = ASIOGetLatencies 的输入+输出</text>
</svg>
